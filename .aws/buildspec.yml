version: 0.2

phases:
  pre_build:
    commands:
      - echo Init Build...
      - dnf install -y python311 python3.11-pip python3.11-devel
  build:
    commands:
      - echo Build Start...
      - echo "$(python3 --version)"
  post_build:
    commands:
      -echo Build Completed...
artifacts:
  files:
    - '**/*'
  name:
    django-community-board-$(date %Y-%m-%d)
